server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Canonical host redirect -- DISABLED until the apex has a certificate.
    #
    # beempowerednetwork.org currently serves Railway's *.up.railway.app
    # wildcard cert, so HTTPS to it fails outright. Turning this on would
    # 301 every working www visitor to a host browsers refuse to load.
    # Re-enable once `curl -sI https://beempowerednetwork.org` returns 200.
    #
    # if ($host = www.beempowerednetwork.org) {
    #     return 301 https://beempowerednetwork.org$request_uri;
    # }

    # Serve .html files without the extension too (/about -> about.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Long cache for images; CSS, JS and HTML always revalidate (ETag) so
    # visitors never see a stale stylesheet after a deploy
    location ~* \.(png|jpg|jpeg|webp|svg|ico|ics)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.(html|css|js|xml|txt)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/xml text/plain;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
